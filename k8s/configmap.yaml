apiVersion: v1
kind: ConfigMap
metadata:
  name: devicestatus-config
  namespace: devicestatus
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_JPA_SHOW_SQL: "false"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "when-authorized"
  MANAGEMENT_INFO_ENV_ENABLED: "true"
  INFO_APP_NAME: "Device Status Management System"
  INFO_APP_DESCRIPTION: "Spring Boot application for managing device status and configurations"
  INFO_APP_VERSION: "1.0.0"
  INFO_APP_ENVIRONMENT: "Production"
  INFO_APP_DEPLOYMENT: "Kubernetes on AWS EKS"
  INFO_APP_DATABASE: "PostgreSQL RDS"
  INFO_APP_AUTHOR: "Your Name"
  INFO_APP_CONTACT_EMAIL: "support@yourcompany.com"
  LOGGING_LEVEL_COM_EXAMPLE_DEVICESTATUS: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "INFO"
  LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
