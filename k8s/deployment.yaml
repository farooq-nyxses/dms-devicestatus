apiVersion: apps/v1
kind: Deployment
metadata:
  name: devicestatus-app
  namespace: devicestatus
  labels:
    app: devicestatus-app
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devicestatus-app
  template:
    metadata:
      labels:
        app: devicestatus-app
        version: v1
    spec:
      containers:
      - name: devicestatus-app
        image: 128121110035.dkr.ecr.ap-south-1.amazonaws.com/devicestatus-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: SPRING_PROFILES_ACTIVE
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: SERVER_PORT
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: devicestatus-secret
              key: DB_URL
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: devicestatus-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devicestatus-secret
              key: DB_PASSWORD
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: SPRING_JPA_HIBERNATE_DDL_AUTO
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
        - name: SPRING_JPA_SHOW_SQL
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: SPRING_JPA_SHOW_SQL
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        - name: MANAGEMENT_INFO_ENV_ENABLED
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: MANAGEMENT_INFO_ENV_ENABLED
        - name: LOGGING_LEVEL_COM_EXAMPLE_DEVICESTATUS
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: LOGGING_LEVEL_COM_EXAMPLE_DEVICESTATUS
        - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB
        - name: LOGGING_PATTERN_CONSOLE
          valueFrom:
            configMapKeyRef:
              name: devicestatus-config
              key: LOGGING_PATTERN_CONSOLE
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
