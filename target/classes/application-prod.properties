# Production configuration for containerized deployment
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devicestatus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Application Info
info.app.name=Device Status Management System
info.app.description=Spring Boot application for managing device status and configurations
info.app.version=1.0.0
info.app.environment=Production
info.app.deployment=Kubernetes on AWS EKS
info.app.database=PostgreSQL RDS
info.app.author=Your Name
info.app.contact.email=support@yourcompany.com

# Logging
logging.level.com.example.devicestatus=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
